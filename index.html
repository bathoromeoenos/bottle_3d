<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bottle 3D Configurator</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; font-family: sans-serif; }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
    }
    button {
      padding: 10px 18px; border: none; border-radius: 8px;
      background: #222; color: white; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #444; }
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="controls">
    <button data-color="#ff3b30">Red</button>
    <button data-color="#34c759">Green</button>
    <button data-color="#0a84ff">Blue</button>
    <button data-color="#ffffff">White</button>
    <button data-color="#1c1c1e">Black</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5,5,5);
    scene.add(dirLight);

    // Load bottle
    let bottleMaterial;
    const loader = new GLTFLoader();
    loader.load('./bottle.glb', (gltf) => {
      const model = gltf.scene;
      model.scale.set(1.5, 1.5, 1.5);
      model.position.y = -8
      scene.add(model);

      // Find the main mesh material to recolor
      model.traverse((child) => {
        if (child.isMesh) {
          bottleMaterial = child.material;
          bottleMaterial.metalness = 0.1;
          bottleMaterial.roughness = 0.4;
        }
      });
    }, undefined, (err) => {
      console.error('Failed to load bottle.glb', err);
    });

    // Color buttons
    document.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        if (bottleMaterial) {
          bottleMaterial.color.set(btn.dataset.color);
        }
      };
    });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
